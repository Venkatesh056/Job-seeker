; Alembic configuration.
;
; The database URL is NOT set here. It is resolved at runtime by
; `careeragent.storage.resolve_url()`, so migrations always run against the same
; database the application uses — a URL duplicated in this file is a URL that will
; eventually disagree with the one in .env, and migrating the wrong database is a
; failure you discover much later.
;
;   alembic upgrade head        apply migrations
;   alembic downgrade -1        undo the last one
;   alembic revision --autogenerate -m "..."   after changing models/

[alembic]
script_location = backend/migrations
prepend_sys_path = backend
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
